      ${setup.type === 'recall' ? '<div class="hint">목록의 주제만 보고 그 목록의 영어 단어를 기억나는 대로 전부 적어요. 다 적으면 맞힌 것·놓친 것·목록에 없는 것을 채점해요.</div>' : ''}
      <div class="hint" id="dirHint" ${setup.type === 'recall' ? 'hidden' : ''}>${({ en: '영어 단어를 보고 뜻을 고릅니다.', ko: '뜻을 보고 영어 단어를 고릅니다.', mix: '두 방향이 무작위로 섞여 나옵니다.', listen: '단어를 숨기고, 스피커 버튼을 눌러 소리로 듣고 뜻을 고릅니다.' })[setup.dir]}</div>
      <div class="setupfoot"><span class="sub">${pool.length ? (setup.type === 'recall' ? `단어 ${recallKeys(pool).length}개 떠올리기` : +setup.chunk ? `${pool.length}단어 · ${setup.chunk}개씩 ${Math.ceil(pool.length / +setup.chunk)}구간 · 넘어가기 전까지 반복` : `${n}문제 · 순서는 매번 랜덤`) : emptyMsg}</span>
        <button class="btn primary" id="start" ${pool.length ? '' : 'disabled'}>시작</button></div>
    </section>`;
    app.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { const id = b.dataset.sel; setup.sel.has(id) ? setup.sel.delete(id) : setup.sel.add(id); render(); });
    $('#rangePick').onclick = () => { rangeOpen = !rOpen; saveRangeOpen(); render(); };
    $('#selAll').onclick = () => { if (setup.sel.size === list.length) setup.sel.clear(); else list.forEach(d => setup.sel.add(d.id)); render(); };
    bindSegs($('#setupOpts'), (k, v) => {
      setup[k] = String(v); saveSetup(); render();
    });
    $('#start').onclick = () => setup.type === 'recall' ? startRecall(poolFor(setup.sel)) : +setup.chunk ? startChunkQuiz(poolFor(setup.sel)) : startQuiz(poolFor(setup.sel));
  }

  // ---------- 전부 써보기(회상 테스트) ----------
  // 단어 칸에서 '영어 표제어'만 뽑는다: 취소선 글자·앞의 *·괄호 설명·한글 뜻·O to V 같은 자리표시 제거
  function headOf(text) {
    let t = String(text).replace(/.\u0336/g, '').replace(/^\s*\*+/, '').replace(/\([^)]*\)/g, ' ');
    const m = t.match(/^[\sA-Za-z'’\-.\/]*/);
    t = (m ? m[0] : '').replace(/\s+/g, ' ').trim();
    t = t.replace(/(\s+(O|A|B|sb|sth))?(\s+to\s+V)?$/i, '').replace(/\s+(O|A|B)$/, '').trim();
    return t;
  }
  const keyOf = t => headOf(t).toLowerCase().replace(/[^a-z]/g, '');
  const inputKey = t => String(t).toLowerCase().replace(/\b(o|a|b)\s+to\s+v\b/g, '').replace(/[^a-z]/g, '');
  // 같은 표제어(예: agree to / agree with)는 하나로 묶어 한 번만 적으면 되게
  function recallKeys(pool) {
    const map = new Map();
    for (const w of pool) { const k = keyOf(w.w); if (!k) continue; if (!map.has(k)) map.set(k, { key: k, head: headOf(w.w), items: [] }); map.get(k).items.push(w); }
    return [...map.values()];
  }
  let recall = null;
  function startRecall(pool) {
    const groups = recallKeys(pool);
    const dayIds = [...new Set(pool.map(w => w.dayId))];
    recall = { groups, dayIds, input: '', hint: false, graded: null };
    view = 'recall'; render();
  }
  function parseRecallInput(text) { return String(text).split(/[\n,;\/]+/).map(x => x.trim()).filter(Boolean); }
  function recallMatch() {
    const keys = new Set(recall.groups.map(g => g.key));
    const typed = parseRecallInput(recall.input);
    const hit = new Set(), extra = [];
    for (const t of typed) { const k = inputKey(t); if (!k) continue; if (keys.has(k)) hit.add(k); else extra.push(t); }
    return { hit, extra };
  }
  function topicsHtml() {
    return recall.dayIds.map(id => days.find(d => d.id === id)).filter(Boolean).map(d => `<div class="qnote"><span class="label">${esc(d.name)}</span>${d.note ? '<br>' + esc(d.note) : ''}</div>`).join('');
  }
  function firstLetterHint() {
    // 목록 순서대로 첫 글자를 묶어 보여준다: p2 · o1 · r3 …
    const seq = [];
    for (const g of recall.groups) { const c = g.head[0].toLowerCase(); if (seq.length && seq[seq.length - 1][0] === c) seq[seq.length - 1][1]++; else seq.push([c, 1]); }
    return seq.map(([c, n]) => `<b>${esc(c)}</b>${n > 1 ? `<span class="num">×${n}</span>` : ''}`).join(' · ');
  }
  function renderRecall() {
    const total = recall.groups.length;
    if (!recall.graded) {
      const { hit } = recallMatch();
      app.innerHTML = `<section class="panel">
        ${topicsHtml()}
        <div class="hint">이 목록의 영어 단어 <b>${total}개</b>를 기억나는 대로 적어 보세요. 한 줄에 하나씩, 또는 쉼표로 구분해요. 순서는 상관없고 대소문자는 구분하지 않아요.</div>
        <textarea id="rcInput" placeholder="permit&#10;persuade&#10;order" autocapitalize="off" autocorrect="off" spellcheck="false" style="min-height:220px">${esc(recall.input)}</textarea>
        <div class="rcbar"><span class="num" id="rcCount">맞힌 단어 ${hit.size} / ${total}</span><button class="btn sm" id="rcHint" type="button">${recall.hint ? '힌트 숨기기' : '첫 글자 힌트'}</button></div>
        <div class="rchint" id="rcHintBox" ${recall.hint ? '' : 'hidden'}>${firstLetterHint()}</div>
        <div class="resbtns"><button class="btn primary" id="rcGrade" type="button">채점</button><button class="btn" id="rcQuit" type="button">그만하기</button></div>
      </section>`;
      const ta = $('#rcInput');
      ta.addEventListener('input', () => { recall.input = ta.value; $('#rcCount').textContent = `맞힌 단어 ${recallMatch().hit.size} / ${total}`; });
      $('#rcHint').onclick = () => { recall.hint = !recall.hint; $('#rcHintBox').hidden = !recall.hint; $('#rcHint').textContent = recall.hint ? '힌트 숨기기' : '첫 글자 힌트'; };
      $('#rcGrade').onclick = () => { recall.input = ta.value; recall.graded = recallMatch(); render(); };
      $('#rcQuit').onclick = () => { recall = null; view = 'setup'; render(); };
      return;
    }
    const { hit, extra } = recall.graded;
    const missed = recall.groups.filter(g => !hit.has(g.key)), got = recall.groups.filter(g => hit.has(g.key));
    const rows = gs => gs.map(g => g.items.map(w => `<div class="row">${marks(w.id, w.w)}<span class="w">${esc(w.w)}</span><span class="m">${esc(w.m)}</span><span class="sub tag">${esc(w.day)}</span></div>`).join('')).join('');
    app.innerHTML = `<section class="panel">
      ${topicsHtml()}
      <div class="score"><span class="big">${got.length}</span><span class="of num">/ ${total}</span><span class="sub">${total ? Math.round(got.length / total * 100) + '%' : ''}</span></div>
      <div class="resbtns">
        ${missed.length ? '<button class="btn" id="rcFocus" type="button">★ 놓친 것 모두 집중</button>' : ''}
        <button class="btn primary" id="rcAgain" type="button">다시 써보기</button>
        <button class="btn" id="rcSetup" type="button">설정 바꾸기</button>
      </div>
      ${missed.length ? `<div class="field"><span class="label">놓친 단어 ${missed.length}</span><div class="list wronglist">${rows(missed)}</div></div>` : '<div class="fb ok"><b>전부 떠올렸어요</b></div>'}
      ${extra.length ? `<div class="field"><span class="label">목록에 없는 입력 ${extra.length}</span><div class="rcextra">${extra.map(x => `<span>${esc(x)}</span>`).join('')}</div><span class="hint">철자가 틀렸거나 이 목록에 없는 단어예요.</span></div>` : ''}
      ${got.length ? `<details class="setbox"><summary>맞힌 단어 ${got.length}</summary><div class="list wronglist">${rows(got)}</div></details>` : ''}
    </section>`;
    bindChecks(app);
    $('#rcFocus') && ($('#rcFocus').onclick = () => { const ids = missed.flatMap(g => g.items.map(w => w.id)); ids.forEach(id => { setFocus(id, true); paintStars(id); }); toast(`${ids.length}개 집중 표시했어요`); });
    $('#rcAgain').onclick = () => { recall.input = ''; recall.graded = null; recall.hint = false; render(); };
    $('#rcSetup').onclick = () => { recall = null; view = 'setup'; render(); };
  }

  // ---------- 유사도(헷갈리는 오답 고르기용) ----------
  const bigrams = t => { const out = []; for (let i = 0; i < t.length - 1; i++) out.push(t.slice(i, i + 2)); return out; };
  function dice(a, b) {
    if (!a || !b) return 0;
    if (a === b) return 1;
    const A = bigrams(a), B = bigrams(b);
    if (!A.length || !B.length) return 0;
    const m = new Map(); A.forEach(x => m.set(x, (m.get(x) || 0) + 1));
    let hit = 0; B.forEach(x => { const c = m.get(x); if (c) { hit++; m.set(x, c - 1); } });
    return 2 * hit / (A.length + B.length);
  }
  function engSim(a, b) {
    a = keyOf(a); b = keyOf(b);
    if (!a || !b || a === b) return 0;
    let s = dice(a, b);
    if (a.slice(0, 3) === b.slice(0, 3)) s += 0.15;                     // 같은 접두(pre-, con- 등)
    if (a.length > 4 && b.length > 4 && a.slice(-3) === b.slice(-3)) s += 0.1; // 같은 어미(-tion, -ate 등)
    if (Math.abs(a.length - b.length) <= 2) s += 0.05;
    return s;
  }
  const korText = t => String(t).replace(/\([^)]*\)/g, '').replace(/[^\uAC00-\uD7A3]/g, '');
  function korSim(a, b) {
    a = korText(a); b = korText(b);
    if (!a || !b || a === b) return 0;
    return dice(a, b);
  }
  const wordSim = (x, y) => Math.max(engSim(x.w, y.w), korSim(x.m, y.m) * 0.9);

  // ---------- quiz ----------
  function startQuiz(pool, limitAll, chunk) {
    let items = shuffle(pool);
    if (!limitAll && !chunk && setup.count !== 'all') items = items.slice(0, +setup.count);
    const all = days.flatMap(d => d.words);
    const byDay = new Map(days.map(d => [d.id, d.words]));
    const nDistract = Math.max(1, (+setup.nopt || 4) - 1);
    quiz = {
      items: items.map(w => {
        const dir = setup.dir === 'mix' ? (Math.random() < .5 ? 'en' : 'ko') : setup.dir;
        let options = null, optSrc = null;
        if (setup.type === 'mc') {
          const key = dir === 'ko' ? 'w' : 'm';
          const seen = new Set([norm(w[key])]);
          const distract = [];
          const src = setup.from === 'day' && byDay.has(w.dayId) ? byDay.get(w.dayId) : all;
          let cands = shuffle(src);
          if (setup.pick === 'similar') {
            // 헷갈리게: 영어 철자가 비슷하거나(앞뒤 글자·글자쌍 겹침) 한글 뜻이 겹치는 순으로. 약간의 무작위로 매번 조금씩 다르게
            const sc = new Map(cands.map(x => [x, wordSim(w, x) + Math.random() * 0.08]));
            cands = cands.filter(x => x !== w && x.id !== w.id).sort((a, b) => sc.get(b) - sc.get(a));
          }
          // 뜻→단어 문제에서 뜻이 똑같은 단어(predict·foresee 등)는 정답이 둘이 되므로 오답 보기에서 뺀다
          for (const x of cands) { if (key === 'w' && norm(x.m) === norm(w.m)) continue; const k = norm(x[key]); if (!seen.has(k)) { seen.add(k); distract.push(x); } if (distract.length >= nDistract) break; }
          // 보기마다 원래 단어를 함께 기억(오답을 골랐을 때 그 보기의 짝을 보여주려고)
          const pairs = shuffle([w, ...distract]);
          options = pairs.map(x => x[key]);
          optSrc = pairs.map(x => ({ id: x.id, w: x.w, m: x.m }));
        }
        return { w, dir, options, optSrc, answer: null, correct: null };
      }),
      i: 0, done: false, spoken: -1, chunk: chunk || null
    };
    view = 'quiz'; render();
  }
  // 구간 반복 테스트: 입력 순서대로 N개씩 끊고, 한 구간을 [다음 구간]을 누를 때까지 반복(매번 문제 순서·보기는 새로)
  function startChunkQuiz(pool) {
    const N = +setup.chunk, parts = [];
    for (let k = 0; k < pool.length; k += N) parts.push(pool.slice(k, k + N));
    runChunk({ parts, ci: 0, round: 1, best: [] });
  }
  function runChunk(ch, onlyWrong) {
    const words = onlyWrong || ch.parts[ch.ci];
    startQuiz(words, true, ch);
  }
  const norm = s => String(s).toLowerCase().replace(/\([^)]*\)/g, '').replace(/[\s.,;:!?'"’~\-·]/g, '');
  function gradeTyped(item, input) {
    const target = item.dir === 'ko' ? item.w.w : item.w.m;
    const parts = target.split(/[,;/、]/).map(norm).filter(Boolean);
    const v = norm(input);
    return !!v && (parts.includes(v) || norm(target) === v);
  }
  function answer(val) {
    const it = quiz.items[quiz.i]; if (it.answer !== null) return;
    it.answer = val;
    it.correct = setup.type === 'mc' ? val === (it.dir === 'ko' ? it.w.w : it.w.m) : gradeTyped(it, val);
    render();
  }
  function next() {
    if (quiz.i < quiz.items.length - 1) { quiz.i++; render(); }
    else { view = quiz.chunk ? 'chunkres' : 'result'; render(); }
  }
  function renderQuiz() {
    const it = quiz.items[quiz.i], total = quiz.items.length, answered = it.answer !== null;
    const right = it.dir === 'ko' ? it.w.w : it.w.m;
    const q = it.dir === 'ko' ? it.w.m : it.w.w;
    const hideQ = it.dir === 'listen' && !answered;
    // 뒤로 돌아와 보는 중인지: 가장 멀리 간 문제보다 앞이면
    quiz.maxI = Math.max(quiz.maxI || 0, quiz.i);
    const reviewing = quiz.i < quiz.maxI;
    let body;
    if (it.options) {
      body = `<div class="opts">${it.options.map((o, k) => {
        let cls = it.dir === 'ko' ? 'opt en' : 'opt';
        if (answered && o === right) cls += ' right'; else if (answered && o === it.answer) cls += ' wrong'; else if (answered) cls += ' dim';
        // 모든 보기에 짝(영단어 또는 뜻) 줄을 처음부터 넣어 두고, 답하기 전엔 보이지 않게만 한다 → 답한 뒤에도 칸 크기가 그대로
        const src = it.optSrc && it.optSrc[k];
        // 결과가 나오면 짝 옆에 그 단어의 체크(✓)·집중(★) 표시도 보여준다(저장된 최신 상태 기준)
        const badges = answered && src && src.id ? `${isChecked(src.id) ? '<span class="obadge ck" title="체크">✓</span>' : ''}${isFocus(src.id) ? '<span class="obadge st" title="집중">★</span>' : ''}` : '';
        const pair = src ? `<span class="opair ${answered ? '' : 'veil'}" ${answered ? '' : 'aria-hidden="true"'}>${esc(it.dir === 'ko' ? src.m : src.w)}${badges}</span>` : '';
        return `<button class="${cls}" data-o="${k}" ${answered ? 'disabled' : ''}><span class="k">${k + 1}</span><span class="otext"><span>${esc(o)}</span>${pair}</span></button>`;
      }).join('')}</div>`;
    } else {
      body = `<form class="answerrow" id="tf" autocomplete="off"><input type="text" id="ta" placeholder="${it.dir === 'ko' ? '영어 단어를 입력' : '뜻을 입력'}" ${answered ? 'disabled' : ''} value="${answered ? esc(it.answer) : ''}" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit" ${answered ? 'disabled' : ''}>확인</button></form>`;
    }
    let fb;
    if (it.options) {
      // 객관식: 보기 안에 단어·뜻이 다 보이므로 결과만 한 줄로, 자리는 늘 확보
      const ri = it.options.indexOf(right) + 1;
      fb = `<div class="fbslot"><div class="fb ${answered ? (it.correct ? 'ok' : 'no') : 'idle'}">${answered ? (it.correct ? '<b>정답</b>' : `<b>오답</b><span class="ans">정답은 ${ri}번</span>`) : '<span class="ans">보기를 고르세요</span>'}</div></div>`;
    } else {
      // 직접 입력: 가장 긴 '오답' 모양을 투명하게 깔아 두고 그 위에 실제 내용을 겹친다 → 높이 고정
      const ghost = `<div class="fb no ghost" aria-hidden="true"><span><b>오답</b> <span class="ans">정답: ${esc(right)}</span></span><button class="btn sm" tabindex="-1">맞은 걸로 처리</button></div>`;
      const real = !answered ? '<div class="fb idle"><span class="ans">답을 입력하고 확인을 누르세요</span></div>'
        : it.correct ? `<div class="fb ok"><b>정답</b><span class="ans">${esc(it.w.w)} · ${esc(it.w.m)}</span></div>`
        : `<div class="fb no"><span><b>오답</b> <span class="ans">정답: ${esc(right)}</span></span><button class="btn sm" id="override">맞은 걸로 처리</button></div>`;
      fb = `<div class="fbslot">${ghost}${real}</div>`;
    }
    app.innerHTML = `<section class="panel">
      ${(() => { const nt = days.find(d => d.id === it.w.dayId)?.note; return nt ? `<div class="qnote">${esc(nt)}</div>` : ''; })()}
      <div class="qtop"><span class="num">${quiz.i + 1} / ${total}</span><span class="sub">${quiz.chunk ? `구간 ${quiz.chunk.ci + 1}/${quiz.chunk.parts.length} · ${quiz.chunk.round}회째` : esc(it.w.day)}</span><span class="grow"></span><button type="button" class="qchk" data-chk="${it.w.id}" aria-pressed="${isChecked(it.w.id)}" title="이 단어 체크(숙지)"><span class="box">${CHK}</span>체크</button><button type="button" class="qchk qstar" data-star="${it.w.id}" aria-pressed="${isFocus(it.w.id)}" title="이 단어 집중"><span class="box">${STAR}</span>집중</button><button class="ghost" id="quit">그만하기</button></div>
      <div class="bar"><i style="width:${(quiz.i + (answered ? 1 : 0)) / total * 100}%"></i></div>
      <div class="prompt"><span class="dir">${it.dir === 'ko' ? '영어 단어는?' : it.dir === 'listen' ? '듣고 뜻을 고르세요' : '뜻은?'}</span><span class="q ${it.dir === 'ko' ? 'ko' : ''}">${hideQ ? '· · ·' : esc(q)}</span>${TTS.ok ? `<button class="spk" id="qSay" aria-label="문제 듣기" title="듣기">${SPK}</button>` : ''}</div>
      ${body}${fb}
      <div class="qfoot"><button class="btn" id="prev" type="button" ${quiz.i > 0 ? '' : 'disabled'}>이전</button><span class="hint">${reviewing ? '<span class="qback">이미 푼 문제예요</span>' : `${it.options ? `숫자키 1–${it.options.length}로 선택, ` : ''}Enter로 다음`}</span><button class="btn primary" id="next" ${answered ? '' : 'hidden'}>${quiz.i < total - 1 ? '다음' : '결과 보기'}</button></div>
    </section>`;
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(it.options[+b.dataset.o]));
    if ($('#tf')) { $('#tf').onsubmit = e => { e.preventDefault(); const v = $('#ta').value.trim(); if (v) answer(v); }; if (!answered) $('#ta').focus(); }
    $('#qSay') && ($('#qSay').onclick = () => sayNow(q));
    // 화면을 다시 그리지 않고 체크만 바꾼다(입력 중인 답이 지워지지 않게)
    bindChecks(app, () => { const ta = $('#ta'); if (it.options && answered) { renderQuiz(); return; } if (ta && !ta.disabled) ta.focus(); else if (answered) $('#next').focus(); });
    $('#override') && ($('#override').onclick = () => { it.correct = true; render(); });
    $('#quit').onclick = () => { if (quiz.chunk) { quiz.chunk = null; view = 'setup'; render(); return; } view = 'result'; quiz.items = quiz.items.filter(x => x.answer !== null); render(); };
    $('#prev').onclick = () => { if (quiz.i > 0) { quiz.i--; render(); } };
    if (answered) $('#next').focus();
    $('#next').onclick = next;
  }
  document.addEventListener('keydown', e => {
    if (view !== 'quiz' || !quiz) return;
    if (e.target && e.target.id === 'qsInput') return;
    const it = quiz.items[quiz.i];
    if (e.key === 'ArrowLeft' && document.activeElement?.tagName !== 'INPUT' && quiz.i > 0) { quiz.i--; render(); return; }
    if (it.options && it.answer === null && /^[1-6]$/.test(e.key) && document.activeElement?.tagName !== 'INPUT') { const o = it.options[+e.key - 1]; if (o !== undefined) answer(o); }
  });

  function renderChunkResult() {
    const ch = quiz.chunk, items = quiz.items, ok = items.filter(x => x.correct).length, wrong = items.filter(x => x.correct === false);
    const last = ch.ci >= ch.parts.length - 1;
    app.innerHTML = `<section class="panel">
      <div class="chunkbar"><span class="num">구간 ${ch.ci + 1} / ${ch.parts.length} · ${ch.round}회째 끝</span></div>
      <div class="score"><span class="big">${ok}</span><span class="of num">/ ${items.length}</span><span class="sub">${items.length ? Math.round(ok / items.length * 100) + '%' : ''}</span></div>
      <div class="resbtns">
        <button class="btn ${wrong.length ? '' : 'primary'}" id="chAgain">이 구간 다시</button>
        ${wrong.length ? `<button class="btn primary" id="chWrong">틀린 ${wrong.length}개만 다시</button>` : ''}
        <button class="btn" id="chNext">${last ? '끝내기' : '다음 구간 →'}</button>
        ${ch.ci ? '<button class="btn" id="chPrev">← 이전 구간</button>' : ''}
      </div>
      <div class="field"><span class="label">이 구간 단어</span><div class="list wronglist">${ch.parts[ch.ci].map(w => { const x = items.find(i => i.w.id === w.id); const tag = x ? (x.correct ? '<span class="sub tag" style="color:var(--ok)">O</span>' : x.correct === false ? '<span class="sub tag" style="color:var(--bad)">X</span>' : '<span class="sub tag">-</span>') : '<span class="sub tag">-</span>'; return `<div class="row">${marks(w.id, w.w)}<span class="w">${esc(w.w)}</span><span class="m">${esc(w.m)}</span>${tag}</div>`; }).join('')}</div></div>
    </section>`;
    bindChecks(app);
    $('#chAgain').onclick = () => { ch.round++; runChunk(ch); };
    $('#chWrong') && ($('#chWrong').onclick = () => { ch.round++; runChunk(ch, wrong.map(x => x.w)); });
    $('#chNext').onclick = () => { if (last) { quiz.chunk = null; view = 'setup'; render(); return; } ch.ci++; ch.round = 1; runChunk(ch); };
    $('#chPrev') && ($('#chPrev').onclick = () => { ch.ci--; ch.round = 1; runChunk(ch); });
  }
  function renderResult() {
    const items = quiz.items, ok = items.filter(x => x.correct).length, wrong = items.filter(x => x.correct === false);
    app.innerHTML = `<section class="panel">
      <div class="score"><span class="big">${ok}</span><span class="of num">/ ${items.length}</span><span class="sub">${items.length ? Math.round(ok / items.length * 100) + '%' : ''}</span></div>
      <div class="resbtns">
        ${wrong.length ? `<button class="btn primary" id="retryWrong">틀린 ${wrong.length}개만 다시</button>` : ''}
        <button class="btn" id="again">같은 범위 다시</button>
        <button class="btn" id="toSetup">설정 바꾸기</button>
      </div>
      ${wrong.length ? `<div class="field"><div class="listhead"><span class="label">틀린 단어</span><span class="resbtns"><button class="btn sm" id="checkWrong">모두 체크</button><button class="btn sm" id="focusWrong">★ 모두 집중</button></span></div><div class="list wronglist">${wrong.map(x => `<div class="row">${marks(x.w.id, x.w.w)}<span class="w">${esc(x.w.w)}</span><span class="m">${esc(x.w.m)}</span><span class="sub tag">${TTS.ok ? `<button class="spk" data-rs="${esc(x.w.w)}" aria-label="${esc(x.w.w)} 듣기">${SPK}</button>` : ''}${esc(x.w.day)}</span></div>`).join('')}</div></div>` : (items.length ? `<div class="fb ok"><b>전부 맞혔어요</b></div>` : '')}
    </section>`;
    $('#retryWrong') && ($('#retryWrong').onclick = () => startQuiz(wrong.map(x => x.w), true));
    $('#again').onclick = () => startQuiz(poolFor(setup.sel));
    $('#toSetup').onclick = () => { view = 'setup'; render(); };
    app.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => sayNow(b.dataset.rs));
    bindChecks(app);
    $('#focusWrong') && ($('#focusWrong').onclick = () => { const ids = [...new Set(wrong.map(x => x.w.id))]; ids.forEach(id => { setFocus(id, true); paintStars(id); }); toast(`${ids.length}개 집중 표시했어요`); });
    $('#checkWrong') && ($('#checkWrong').onclick = () => { const ids = [...new Set(wrong.map(x => x.w.id))]; ids.forEach(id => { setChecked(id, true); paintChecks(id); }); toast(`${ids.length}개 체크했어요`); });
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target && e.target.id === 'qsInput') return;
    // 버튼에 포커스가 있으면 그 버튼이 Enter를 처리하게 둔다(이전·체크 버튼 등)
    if (view === 'quiz' && quiz.items[quiz.i].answer !== null && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); next(); }
  });

  // ---------- text export (for text-reader apps) ----------
  const exportOpt = { sel: [], only: false, srep: 1, meaning: true, gap: 2, style: 'blank', title: true, order: 'seq', num: false, tilde: 'keep' };
  try { const o = JSON.parse(localStorage.getItem('vocab-export') || '{}'); delete o.sel; if ('mrep' in o || 'rep' in o) { if (typeof o.mrep === 'number') o.meaning = o.mrep > 0; delete o.mrep; delete o.rep; } Object.assign(exportOpt, o); } catch (e) {}
  const saveExportOpt = () => { try { const { sel, ...rest } = exportOpt; localStorage.setItem('vocab-export', JSON.stringify(rest)); } catch (e) {} };
  let exportSetOpen = false;
  const exportSummary = () => `${exportOpt.meaning ? '단어+뜻' : '단어만'} ${exportOpt.srep}회 · 간격 ${exportOpt.gap}줄${({ dot: '(마침표)', comma: '(쉼표)' })[exportOpt.style] || ''} · ${exportOpt.order === 'rand' ? '랜덤' : '입력 순서'}`;
  const withDot = t => /[.!?。…]$/.test(t.trim()) ? t.trim() : t.trim() + '.';
  const tildeText = t => exportOpt.tilde === 'say' && /[\uAC00-\uD7A3]/.test(t) ? t.replace(/[~～∼]\s*/g, '뭐뭐') : t;
  function buildText() {
    const out = [];
    const gapLines = () => { for (let k = 0; k < exportOpt.gap; k++) out.push(({ dot: '.', comma: ',' })[exportOpt.style] || ''); };
    const pick = d => d.words.filter(w => markOk(w, exportOpt.only));
    const chosen = sorted().filter(d => exportOpt.sel.includes(d.id) && pick(d).length);
    chosen.forEach((d, di) => {
      if (exportOpt.title) { out.push(withDot(d.name)); if (d.note) d.note.split('\n').filter(Boolean).forEach(l => out.push(withDot(l))); gapLines(); }
      const ws = exportOpt.order === 'rand' ? shuffle(pick(d)) : pick(d);
      ws.forEach((w, i) => {
        // 단어→뜻 세트를 srep번 반복. 반복 사이엔 간격 줄 1개, 다음 단어 전엔 설정한 간격만큼
        for (let r = 0; r < exportOpt.srep; r++) {
          out.push((exportOpt.num && r === 0 ? `${i + 1}. ` : '') + withDot(w.w.replace(/\n+/g, ', ')));
          if (exportOpt.meaning) out.push(withDot(tildeText(w.m.replace(/\n+/g, ', '))));
          if (r < exportOpt.srep - 1) out.push(({ dot: '.', comma: ',' })[exportOpt.style] || '');
        }
        gapLines();
      });
      if (di < chosen.length - 1) gapLines();
    });
    while (out.length && ['', '.', ','].includes(out[out.length - 1])) out.pop();
    return out.join('\n') + '\n';
  }
  function renderExport() {
    const list = sorted().filter(d => d.words.length);
    exportOpt.sel = exportOpt.sel.filter(id => list.find(d => d.id === id));
    const text = buildText();
    const cnt = d => d.words.filter(w => markOk(w, exportOpt.only)).length;
    const nWords = list.filter(d => exportOpt.sel.includes(d.id)).reduce((s, d) => s + cnt(d), 0);
    const xOpen = rangeOpen || !exportOpt.sel.length;
    const nChkSel = list.filter(d => exportOpt.sel.includes(d.id)).reduce((s, d) => s + d.words.filter(w => w.checked).length, 0);
    const nFocSel = list.filter(d => exportOpt.sel.includes(d.id)).reduce((s, d) => s + d.words.filter(w => w.focus).length, 0);
    app.innerHTML = `<section class="panel">
      <div class="dayhead"><strong style="font-size:18px;flex:1">텍스트로 뽑기</strong><button class="btn sm" id="xBack">단어장으로</button></div>
      <div class="hint">텍스트 리더 앱용이에요. 단어와 뜻 끝에 마침표를 붙이고, 세트 사이에 간격 줄을 넣어 쉬어 가며 읽게 해요.</div>
      <div class="field daybar">${rangeHdr('xRangePick', list.filter(d => exportOpt.sel.includes(d.id)).map(d => d.name), xOpen)}<div class="days daylist" ${xOpen ? '' : 'hidden'}>${list.map(d => `<button class="chip" data-xs="${d.id}" aria-pressed="${exportOpt.sel.includes(d.id)}">${esc(d.name)} <span class="num">${exportOpt.only === 'focus' ? '★' + cnt(d) : exportOpt.only ? '✓' + cnt(d) : cnt(d)}</span></button>`).join('')}</div></div>
      <div class="olist" id="xTarget">${segRow('xt', 'only', '대상', exportOpt.only, [[false, '전체'], [true, `체크 (${nChkSel})`], ['focus', `★ 집중 (${nFocSel})`]])}</div>
      <details class="setbox" id="xDetails" ${exportSetOpen ? 'open' : ''}><summary>내보내기 설정 <span class="hint" id="xSum">${exportSummary()}</span></summary>
        <div class="olist" id="xOpts">
          ${segRow('export', 'srep', '세트 반복', exportOpt.srep, nOpts([1, 2, 3], '회'))}
          ${segRow('export', 'meaning', '뜻', exportOpt.meaning, [[true, '넣기'], [false, '빼기']])}
          ${segRow('export', 'gap', '세트 간격', exportOpt.gap, [[1, '1줄'], [2, '2줄'], [4, '4줄'], [6, '6줄']])}
          ${segRow('export', 'style', '간격 모양', exportOpt.style, [['blank', '빈 줄'], ['dot', '마침표'], ['comma', '쉼표']])}
          ${segRow('export', 'order', '순서', exportOpt.order, [['seq', '입력 순서'], ['rand', '랜덤']])}
          ${segRow('export', 'title', 'Day 제목', exportOpt.title, [[true, '넣기'], [false, '빼기']])}
          ${segRow('export', 'tilde', '물결(~)', exportOpt.tilde, [['keep', '그대로'], ['say', "'뭐뭐'로 바꾸기"]])}
          ${segRow('export', 'num', '번호', exportOpt.num, [[false, '빼기'], [true, '넣기']])}
        </div>
        <div class="hint">앱이 빈 줄을 무시하고 바로 이어 읽으면 간격 모양을 "쉼표"나 "마침표"로 바꾸고, 간격 줄 수를 늘려 길이를 조절해 보세요.</div>
      </details>
      <div class="field"><span class="label">미리보기 <span class="num" id="xCount">· ${nWords}단어</span></span>
        ${!nWords && exportOpt.only && exportOpt.sel.length ? `<div class="hint">고른 목록에 ${exportOpt.only === 'focus' ? '집중 표시한' : '체크한'} 단어가 없어요.</div>` : ''}
        <textarea id="xText" readonly style="min-height:220px">${esc(text)}</textarea></div>
      <div class="actionbar"><button class="btn primary" id="xCopy" ${nWords ? '' : 'disabled'}>전체 복사</button><button class="btn" id="xSave" ${nWords ? '' : 'disabled'}>파일로 저장</button></div>
    </section>`;
    $('#xRangePick').onclick = () => { rangeOpen = !xOpen; saveRangeOpen(); render(); };
    $('#xBack').onclick = () => { view = 'words'; render(); };
    app.querySelectorAll('[data-xs]').forEach(b => b.onclick = () => { const id = b.dataset.xs; exportOpt.sel = exportOpt.sel.includes(id) ? exportOpt.sel.filter(x => x !== id) : exportOpt.sel.concat(id); render(); });
    bindSegs($('#xTarget'), (k, v) => { exportOpt.only = v; saveExportOpt(); render(); });
    $('#xDetails').ontoggle = e => { exportSetOpen = e.target.open; };
    bindSegs($('#xOpts'), (k, v) => { exportOpt[k] = v; saveExportOpt(); $('#xText').value = buildText(); $('#xSum').textContent = exportSummary(); });
    $('#xCopy').onclick = async () => {
      const ta = $('#xText');
      try { await navigator.clipboard.writeText(ta.value); toast('복사했어요. 텍스트 리더 앱에 붙여넣으세요'); }
      catch (e) { ta.removeAttribute('readonly'); ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (_) {} const ok = document.execCommand && document.execCommand('copy'); ta.setAttribute('readonly', ''); toast(ok ? '복사했어요' : '전체 선택해 두었어요. 직접 복사해 주세요'); }
    };
    $('#xSave').onclick = () => {
      const names = list.filter(d => exportOpt.sel.includes(d.id)).map(d => d.name);
      const base = ((names.length === 1 ? names[0] : `단어장 ${names.length}개 Day`) + (exportOpt.only === 'focus' ? ' 집중' : exportOpt.only ? ' 체크' : '')).replace(/[\\/:*?"<>|]/g, '_');
      const blob = new Blob(['\uFEFF' + $('#xText').value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = base + '.txt';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('텍스트 파일을 저장했어요');
    };
  }

  // ---------- quiz search: 모든 목록에서 영어·뜻 부분 일치(LIKE '%q%') ----------
  function hl(text, q) {
    const t = String(text), i = t.toLowerCase().indexOf(q);
    return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
  }
  function runSearch() {
    const drop = $('#qsDrop'), q = clean($('#qsInput').value).toLowerCase();
    if (!q) { drop.hidden = true; return; }
    const res = [];
    for (const d of sorted()) for (const w of d.words) if (w.w.toLowerCase().includes(q) || w.m.toLowerCase().includes(q)) res.push({ w, d });
    const LIMIT = 100;
    drop.innerHTML = `<div class="qshead"><span>${res.length ? `${res.length}개 찾음${res.length > LIMIT ? ` · 앞의 ${LIMIT}개만 표시` : ''}` : '결과 없음'}</span><button class="ghost" type="button" id="qsClose">닫기</button></div>`
      + (res.length ? res.slice(0, LIMIT).map(({ w, d }) => `<div class="qsi" data-go-day="${d.id}" data-go-w="${w.id}">${marks(w.id, w.w)}<span class="w">${hl(w.w, q)}</span><span class="m">${hl(w.m, q)}</span><span class="tag">${esc(d.name)}</span></div>`).join('')
        : `<div class="qsempty">"${esc(q)}"이(가) 들어간 단어나 뜻이 없어요</div>`);
    drop.hidden = false; drop.scrollTop = 0;
    // 단어장에서는 결과를 누르면 그 목록으로 이동해 해당 단어를 보여준다(테스트 중에는 이동하지 않음)
    drop.classList.toggle('canjump', view === 'words');
    if (view === 'words') drop.querySelectorAll('[data-go-w]').forEach(r => r.onclick = e => {
      if (e.target.closest('.marks')) return;
      drop.hidden = true; stopPlayer(); exitSelect(); editingWord = null;
      curDay = r.dataset.goDay; render();
      const row = document.querySelector(`.list .row[data-w="${r.dataset.goW}"]`);
      if (row) { try { row.scrollIntoView({ block: 'center' }); } catch (_) {} row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1600); }
    });
    $('#qsClose').onclick = () => { drop.hidden = true; };
    bindChecks(drop);
  }
  let qsTimer = null;
  $('#qsInput').addEventListener('input', () => { clearTimeout(qsTimer); qsTimer = setTimeout(runSearch, 150); });
  $('#qsInput').addEventListener('focus', () => { if ($('#qsInput').value.trim()) runSearch(); });
  $('#qsInput').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#qsDrop').hidden = true; } });
  // 검색 버튼(또는 키보드의 검색 키): 결과를 보여주고 키보드를 내려 목록이 가려지지 않게
  $('#qsForm').addEventListener('submit', e => { e.preventDefault(); clearTimeout(qsTimer); runSearch(); $('#qsInput').blur(); });
  // 검색창 바깥을 누르면 목록 닫기
  document.addEventListener('pointerdown', e => { if (!$('#qsearch').contains(e.target)) $('#qsDrop').hidden = true; });

  // ---------- tabs ----------
  function switchTab(t) {
    stopPlayer(); cancelSpeech(); exitSelect(); dayOrdering = false;
    // 테스트로 갈 때 고른 범위가 없으면 지금 보던 목록을 범위로
    if (t !== 'words' && !setup.sel.size && curDay) setup.sel.add(curDay);
    view = t === 'words' ? 'words' : 'setup';
    $('#tab-words').setAttribute('aria-selected', t === 'words');
    $('#tab-test').setAttribute('aria-selected', t !== 'words');
    render();
  }
  $('#appVer').textContent = '버전 ' + APP_VER;
  $('#exportBtn').onclick = exportBackup;
  // 홈 화면 웹앱엔 새로고침 버튼이 없어서 직접 제공. 주소에 매번 다른 값을 붙여 캐시된 예전 파일 대신 새 파일을 받는다
  $('#reloadBtn').onclick = () => { stopPlayer(); try { location.replace(location.pathname + '?v=' + Date.now()); } catch (e) { location.reload(); } };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => { const f = e.target.files[0]; if (f) readImport(f); e.target.value = ''; };
  $('#tab-words').onclick = () => switchTab('words');
  $('#tab-test').onclick = () => switchTab('test');

  let lastKey = '';
  function render() {
    const y = window.scrollY || 0;
    if (view === 'words') renderWords();
    else if (view === 'setup') renderSetup();
    else if (view === 'import') renderImport();
    else if (view === 'export') renderExport();
    else if (view === 'recall') renderRecall();
    else if (view === 'quiz') renderQuiz();
    else if (view === 'chunkres') renderChunkResult();
    else renderResult();
    // 검색창: 단어장과 문제 풀이 화면에서 보임
    const showSearch = view === 'quiz' || view === 'words';
    $('#qsearch').hidden = !showSearch;
    if (!showSearch) $('#qsDrop').hidden = true;
    // 같은 화면을 다시 그린 경우(수정·삭제·저장 등)엔 보던 위치로 되돌린다
    const key = view + '|' + curDay;
    if (key === lastKey) window.scrollTo(0, y);
    lastKey = key;
  }

  loadLocal();
  { const fixed = cleanAll(); if (fixed) { saveLocal(); setTimeout(() => toast(`깨진 문자가 섞인 항목 ${fixed}개를 정리했어요`), 300); } }
  setStatus(); render();
})();
</script>

</body>
</html>
