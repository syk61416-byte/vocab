<!doctype html>
<html lang="ko">
<head>
<title>Day별 단어장</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column workbench — day index on top, active day's word list below; quiz replaces it with one card at a time */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --line:#D3DCDF; --ink:#16252B; --muted:#5B6D74;
  --accent:#1F5F73; --accent-ink:#FFFFFF; --accent-soft:#DCEAEE;
  --ok:#2C7A4B; --ok-soft:#DFF1E5; --bad:#B03A2E; --bad-soft:#F8E1DE;
  --star:#B7791F; --star-soft:#FBEFD6;
  /* 서체는 하나(IBM Plex Sans KR)로 통일하고 크기·굵기로만 구분 */
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-word:var(--f-ui);
  --f-num:var(--f-ui);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171A; --surface:#172227; --line:#2A3A40; --ink:#E4ECEE; --muted:#93A6AD;
  --accent:#6FB3C6; --accent-ink:#0B1416; --accent-soft:#1E3640;
  --ok:#6CC992; --ok-soft:#18332A; --bad:#EE8A7E; --bad-soft:#3A1F1C; --star:#F2B84B; --star-soft:#3A2D12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172227; --line:#2A3A40; --ink:#E4ECEE; --muted:#93A6AD;
  --accent:#6FB3C6; --accent-ink:#0B1416; --accent-soft:#1E3640;
  --ok:#6CC992; --ok-soft:#18332A; --bad:#EE8A7E; --bad-soft:#3A1F1C; --star:#F2B84B; --star-soft:#3A2D12; color-scheme:dark}

*{box-sizing:border-box}
/* 탭을 오가도 스크롤바 유무로 가운데가 흔들리지 않게 항상 스크롤 자리 확보 */
html{overflow-y:scroll}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}
.daybar{gap:10px}
.addday-row{display:flex;align-items:center;gap:8px}
.addday-row .kwlabel{font-size:13px;color:var(--muted);font-weight:600;flex:none}
.addday-row input{flex:1;min-width:0;padding:7px 10px}
.addday-row .btn{flex:none;white-space:nowrap}
.chip.dchip{display:flex;align-items:center;gap:6px;cursor:default;padding:4px 10px 4px 4px;-webkit-user-select:none;user-select:none}
.dchip .dhandle{width:34px;height:34px}
.dchip .dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip.dragging{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 18px color-mix(in srgb, #000 30%, transparent)}
.daylist.dordering .dchip{justify-content:flex-start}
.dayhdr{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}
.dayhdr .label{flex:none}
.dayhdr .dpcur{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayhdr .dpar{flex:none;font-size:13px;color:var(--accent);font-weight:600}
.dayhdr[aria-expanded="true"]{border-color:var(--accent)}
/* hidden 속성은 어떤 display 규칙보다 우선 (모달·입력칸 숨김이 확실히 먹도록) */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--f-ui);padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button{font-family:var(--f-ui)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--f-ui);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.ghost{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.ghost:hover{color:var(--ink);background:var(--accent-soft)}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* day index */
.days{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 14px var(--f-ui);cursor:pointer}
.chip .num{font-size:12px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.addbox{border:1px solid var(--line);border-radius:10px;padding:0 12px}
.addbox > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:11px 0}
.addbox > summary::-webkit-details-marker{display:none}
.addbox > summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.addbox[open] > summary::before{content:"−"}
.addin{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.daynote{display:flex;flex-direction:column;gap:4px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;cursor:text}
.daynote .label{color:var(--accent)}
.daynote textarea{min-height:0;resize:none;overflow:hidden;border:0;background:transparent;padding:0;font:600 16px/1.5 var(--f-ui);color:var(--ink);white-space:pre-wrap}
.daynote textarea::placeholder{font-weight:400;color:var(--muted)}
.daynote.empty{background:transparent;border:1px dashed var(--line)}
.daynote.empty .label{color:var(--muted)}
.rcbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rcbar .num{font-weight:600;color:var(--accent)}
.rchint{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:16px;letter-spacing:.02em;overflow-wrap:anywhere}
.rchint .num{font-size:12px;color:var(--muted);margin-left:1px}
.rcextra{display:flex;flex-wrap:wrap;gap:6px}
.rcextra span{background:var(--star-soft);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:14px}
.qnote .label{color:var(--accent);text-transform:none;letter-spacing:0}
.qnote{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.dayname{font:700 20px var(--f-ui);border:1px solid transparent;background:none;color:var(--ink);padding:2px 6px;margin-left:-6px;border-radius:6px;width:12ch;min-width:0;flex:1 1 140px}
.dayname:hover{border-color:var(--line)}
.dayhead .spacer{flex:1}
.addform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:start}
input[type=text],input[type=search],textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px var(--f-ui);padding:9px 11px;border-radius:8px}
textarea{min-height:130px;font-family:var(--f-num);font-size:16px;resize:vertical}
.bulk{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted)}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:4.2em minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row .idx{color:var(--muted);font-size:12px}
.row .w{font:600 18px var(--f-word);overflow-wrap:anywhere;white-space:pre-line}
textarea.grow{min-height:0;resize:none;overflow:hidden;font-family:var(--f-ui);line-height:1.45}
.row .m{overflow-wrap:anywhere;white-space:pre-line}
.row .acts{display:flex;gap:2px}
.chk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;border-radius:6px;flex:none}
.chk .box{width:19px;height:19px;border:2px solid var(--muted);border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .12s,border-color .12s}
.chk .box svg{width:13px;height:13px}
.chk:hover .box{border-color:var(--accent)}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--f-ui);padding:4px 10px 4px 6px;border-radius:999px;cursor:pointer}
.qchk .box{width:17px;height:17px;border:2px solid var(--muted);border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent}
.qchk .box svg{width:11px;height:11px}
.qchk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qchk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qtop .grow{flex:1}
/* 집중 표시(★): 체크(✓, 숙지)와 모양·색을 구분 */
.marks{display:flex;align-items:center}
.star{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;border-radius:6px;flex:none;color:var(--muted)}
.star svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.star:hover{color:var(--star)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:var(--star)}
.qstar .box{border:0;width:auto;height:auto;color:var(--muted)}
.qstar .box svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.qstar[aria-pressed="true"]{border-color:var(--star);background:var(--star-soft);color:var(--star)}
.qstar[aria-pressed="true"] .box{background:none;color:var(--star)}
.qstar[aria-pressed="true"] .box svg{fill:var(--star)}
.row.speaking{background:var(--accent-soft);border-radius:6px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer;flex:none}
.spk:hover{color:var(--accent);background:var(--accent-soft)}
.spk svg{width:18px;height:18px}
.prompt .spk{width:40px;height:40px;align-self:center;color:var(--accent)}
.prompt .spk svg{width:24px;height:24px}
.listen{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.listen .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.listen .now{flex:1 1 160px;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listen .now b{font:600 15px var(--f-word);color:var(--ink)}
.listen .opts2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.mini .seg button{padding:4px 9px;font-size:13px}
.listen-in{display:flex;flex-direction:column;gap:10px}
.chunkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.chunkbar .num{font-size:13px;font-weight:600;color:var(--accent)}
.chunkbar .cbtns{display:flex;gap:6px;flex-wrap:wrap}
.mini select{max-width:min(260px,62vw);font:16px var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.row.editing{grid-template-columns:2.2em minmax(0,1fr) minmax(0,1.4fr) auto}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* test setup */
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--f-ui);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.setupfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prompt{text-align:center;padding:26px 8px 18px;display:flex;flex-direction:column;gap:6px}
.prompt .dir{font-size:12px;color:var(--muted)}
.prompt .q{font:600 clamp(28px,7vw,42px)/1.2 var(--f-word);overflow-wrap:anywhere;white-space:pre-line;text-wrap:balance}
.prompt .q.ko{font:700 clamp(22px,5.5vw,30px)/1.35 var(--f-ui)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{white-space:pre-line;display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-ui);padding:12px;border-radius:8px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt .otext{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .opair{font:500 14px var(--f-ui);color:var(--muted)}
.opt .opair.veil{visibility:hidden}
.opt.right .opair{color:var(--ok);font-weight:600}
.opt.wrong .opair{color:var(--bad);font-weight:600}
.opt.dim{color:var(--muted)}
.opt.dim .opair{opacity:.85}
.fbslot{display:grid}
.wopen{cursor:pointer}
.wopen:hover{color:var(--accent)}
.exmark{display:inline-block;margin-left:6px;vertical-align:2px;font:700 10px var(--f-ui);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 4px}
.wscard{width:min(520px,100%);max-height:85%;overflow:auto}
#wsBody{display:flex;flex-direction:column;gap:12px}
.wshead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wstitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.wstitle strong{font-size:22px;overflow-wrap:anywhere;white-space:pre-line}
.wstitle span{color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.exlist{display:flex;flex-direction:column;gap:12px}
.exitem{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--accent-soft);padding-left:10px}
.exen{display:flex;align-items:flex-start;gap:6px;font-weight:600;font-size:16px;line-height:1.5}
.exen span{flex:1;min-width:0;overflow-wrap:anywhere}
.exko{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.obadge{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;line-height:1}
.obadge.ck{color:var(--accent)}
.obadge.st{color:var(--star)}
.ratectl{display:flex;align-items:center;gap:8px;min-width:0}
.ratectl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.ratectl .btn{min-width:36px;font-size:18px;line-height:1;padding:4px 8px}
.rateval{min-width:3.4em;text-align:right;font-weight:600;color:var(--accent)}
.fbslot > .fb{grid-area:1 / 1}
.fbslot > .fb.ghost{visibility:hidden}
.fb.idle{background:var(--bg);color:var(--muted)}
.opt .k{font:500 12px var(--f-num);color:var(--muted);padding-top:3px}
.opt.en{font:600 17px var(--f-word)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answerrow{display:flex;gap:8px}
.fb{border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--ink)}
.fb b{font-weight:700}
.qfoot{display:flex;align-items:center;gap:8px}
.qfoot .hint{flex:1;min-width:0;text-align:center}
.qback{font-size:12px;color:var(--accent);font-weight:600}

/* result */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font:500 44px var(--f-num)}
.score .of{color:var(--muted)}
.wronglist .row{grid-template-columns:4.2em minmax(0,1fr) minmax(0,1.4fr) auto}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.resbtns{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.backup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.wrap,.backup{min-width:0}
.qsearch{position:relative;min-width:0}
.qsearch form{display:flex;gap:8px}
.qsearch input[type=search]{flex:1;-webkit-appearance:none;appearance:none}
.qsdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px color-mix(in srgb, #000 28%, transparent);max-height:min(55vh,440px);overflow:auto;-webkit-overflow-scrolling:touch}
.qshead{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.qsi{display:grid;grid-template-columns:2.1em minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 12px 9px 6px;border-bottom:1px solid var(--line)}
.qsi:last-child{border-bottom:0}
.qsi > .marks{grid-row:1 / span 2;flex-direction:column}
.qsi .w{font:600 17px var(--f-word);overflow-wrap:anywhere}
.qsi .m{grid-column:2;overflow-wrap:anywhere;font-size:14px}
.qsi .tag{grid-column:3;grid-row:1 / span 2;font-size:12px;color:var(--muted);white-space:nowrap}
.qsi mark{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:3px;padding:0 1px}
.qsdrop.canjump .qsi{cursor:pointer}
.qsdrop.canjump .qsi:hover{background:var(--bg)}
.handle{display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:8px}
.handle svg{width:22px;height:22px}
.handle:hover{color:var(--accent);background:var(--accent-soft)}
.ordrow .acts{gap:6px}
.row.editrow{grid-template-columns:auto minmax(0,1fr) minmax(0,1.4fr) auto}
.eicons{display:flex;align-items:center}
.ordrow .acts .btn{min-width:38px}
.row.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 8px 24px color-mix(in srgb, #000 30%, transparent);border-radius:8px;cursor:grabbing}
.row.flash{background:var(--accent-soft);border-radius:6px;transition:background .3s}
.qsempty{padding:18px 12px;text-align:center;color:var(--muted);font-size:14px}
.toast{z-index:60;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

/* settings as visible segmented rows: every choice on screen, current one filled */
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:5.6em minmax(0,1fr);align-items:center;gap:12px;padding:9px 0}
.orow + .orow{border-top:1px solid var(--line)}
.olabel{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.segc{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:0}
.segc button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--muted);font:500 14px var(--f-ui);padding:8px 4px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s}
.segc button:hover:not(:disabled){color:var(--ink)}
.segc button[aria-checked="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent),0 0 0 1px var(--line)}
.segc button:disabled{opacity:.4;cursor:not-allowed}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-ui);padding:6px 10px;border-radius:999px;cursor:pointer}
.vchips button small{color:var(--muted);font-size:11px;margin-left:4px}
.vchips button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.vsel{width:100%;min-width:0;font:16px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 32px 9px 12px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis;cursor:pointer}
.orow.top{align-items:start}
.orow.top .olabel{padding-top:7px}
@media (max-width:540px){.segc button{font-size:13px;padding:8px 2px}.orow{grid-template-columns:5em minmax(0,1fr);gap:10px}}
@media (max-width:380px){.orow{grid-template-columns:1fr;gap:6px}.orow.top .olabel{padding-top:0}}
/* compact settings: labeled native selects in a grid (mobile pickers) */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.sf{display:flex;flex-direction:column;gap:4px;min-width:0}
.sf > span{font-size:12px;color:var(--muted);font-weight:600}
.sf select{width:100%;min-width:0;font:16px var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.sf.wide{grid-column:1 / -1}
details.setbox{border-top:1px solid var(--line);padding-top:8px}
details.setbox > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);padding:4px 0}
details.setbox > summary::-webkit-details-marker{display:none}
details.setbox > summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.setbox[open] > summary::before{transform:rotate(45deg)}
details.setbox > summary .hint{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.setbox > .sets{padding-top:10px}
.dayacts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.dayacts .danger{margin-left:auto}
.actionbar{position:sticky;bottom:0;display:flex;gap:8px;background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);margin:0 -18px -18px;padding-left:18px;padding-right:18px;border-radius:0 0 var(--r) var(--r)}
.actionbar .btn{flex:1}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:var(--surface);font-weight:600}
.btn.danger-fill:disabled{opacity:.4}
/* 선택 삭제 모드 */
.selb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;flex:none}
.selb .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent}
.selb .dot svg{width:12px;height:12px}
.selb[aria-pressed="true"] .dot{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.row.picking{cursor:pointer}
.row.picked{background:var(--bad-soft);border-radius:6px}
.selbar{align-items:center;flex-wrap:wrap}
.selbar .selcount{flex:1 1 auto;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.selbar .btn{flex:0 0 auto}
.selhint{font-size:13px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
/* 확인 모달 */
.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb, #000 50%, transparent);display:flex;align-items:center;justify-content:center;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.mcard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px color-mix(in srgb, #000 35%, transparent)}
.mcard strong{font-size:17px}
.mbody{font-size:14px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.mbody b{color:var(--ink)}
.mlist{margin:6px 0 0;padding:8px 12px;background:var(--bg);border-radius:8px;max-height:32vh;overflow:auto;list-style:none;display:flex;flex-direction:column;gap:2px}
.mbtns{display:flex;gap:8px}
.mbtns .btn{flex:1;padding:10px 14px}
@media (max-width:540px){
  .daylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .daylist .chip{justify-content:space-between;min-width:0}
  .daylist .chip.add{grid-column:1 / -1;justify-content:center}
  .wrap{padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-top:14px;gap:14px}
  .panel{padding:12px}
  .actionbar{margin:0 -12px -12px;padding-left:12px;padding-right:12px}
  .listen{padding:10px}
  .sets{grid-template-columns:1fr 1fr}
  #xText{min-height:150px!important}
}
@media (max-width:540px){
  .addform{grid-template-columns:1fr 1fr}
  .addform .btn{grid-column:1 / -1}
  .opts{grid-template-columns:1fr}
  .row{grid-template-columns:2.1em minmax(0,1fr) auto;row-gap:2px}
  .row > .chk, .row > .idx, .row > .selb, .row > .marks, .row > .handle, .row > .eicons{grid-row:1 / span 2}
  .row.editrow{grid-template-columns:auto minmax(0,1fr) auto}
  .row > .marks{flex-direction:column}
  .row .m{grid-column:2;grid-row:2}
  .row .acts{grid-column:3;grid-row:1 / span 2}
  .row.editing{grid-template-columns:minmax(0,1fr);row-gap:8px;padding:12px 0}
  .row.editing > .idx{display:none}
  .row.editing input, .row.editing textarea{grid-column:1;grid-row:auto}
  .row.editing .acts{grid-column:1;grid-row:auto;justify-content:flex-end;gap:8px}
  .wronglist .row{grid-template-columns:2.1em minmax(0,1fr) auto}
  .wronglist .row .m{grid-column:2;grid-row:2}
  .wronglist .row .tag{grid-column:3;grid-row:1 / span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="wrap">
  <header>
    <div>
      <h1>Day별 단어장</h1>
      <div class="status" id="status">불러오는 중…</div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-words" aria-selected="true">단어장</button>
      <button role="tab" id="tab-test" aria-selected="false">테스트</button>
    </div>
  </header>
  <div class="qsearch" id="qsearch" hidden>
    <form id="qsForm" role="search" autocomplete="off">
      <input type="search" id="qsInput" placeholder="전체 목록에서 단어 찾기 (영어·뜻)" aria-label="전체 단어 검색" enterkeyhint="search" autocapitalize="off" spellcheck="false">
      <button class="btn sm" type="submit">검색</button>
    </form>
    <div class="qsdrop" id="qsDrop" hidden></div>
  </div>
  <main id="app"></main>
  <footer class="backup">
    <span class="hint" id="appVer"></span>
    <span class="hint" id="followDbg"></span>
    <span class="hint">단어는 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 사라지니 가끔 백업 파일을 받아 두세요.</span>
    <span class="resbtns"><button class="btn sm" id="exportBtn">백업 파일 받기</button><button class="btn sm" id="importBtn" type="button">백업 불러오기</button><input type="file" id="importFile" class="vh" tabindex="-1" aria-hidden="true"><button class="btn sm" id="reloadBtn" type="button" title="최신 버전을 다시 받아옵니다. 단어는 그대로예요">새로 불러오기</button></span>
  </footer>
</div>
<div class="modal" id="wsheet" hidden role="dialog" aria-modal="true" aria-labelledby="wsWord">
  <div class="mcard wscard">
    <div class="wshead"><div class="wstitle"><strong id="wsWord"></strong><span id="wsMean"></span></div><button class="ghost" id="wsClose" type="button" aria-label="닫기">닫기</button></div>
    <div id="wsBody"></div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mcard"><strong id="mTitle"></strong><div class="mbody" id="mBody"></div>
    <div class="mbtns"><button class="btn" id="mCancel" type="button">취소</button><button class="btn danger-fill" id="mOk" type="button">삭제</button></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- state ----------
  let days = [];            // [{id,name,order,words:[{id,w,m}]}]
  let view = 'words';       // words | setup | quiz | result
  let curDay = null;
  let editingWord = null;
  let bulkOpen = false;
  let addOpen = (() => { try { return localStorage.getItem('vocab-add-open') === '1'; } catch (e) { return false; } })();
  const saveAddOpen = () => { try { localStorage.setItem('vocab-add-open', addOpen ? '1' : '0'); } catch (e) {} };
  let selecting = false;           // 선택 삭제 모드
  const picked = new Set();        // 선택된 단어 id
  // 삭제 확인 모달: 결과를 Promise<boolean>으로 돌려준다
  // 단어 상세: 예문 보기·편집
  function openWordSheet(id) {
    const f = findWord(id); if (!f) return;
    const w = f.word, m = $('#wsheet'), vv = window.visualViewport;
    const place = () => { if (!vv) return; Object.assign(m.style, { top: vv.offsetTop + 'px', left: vv.offsetLeft + 'px', width: vv.width + 'px', height: vv.height + 'px', right: 'auto', bottom: 'auto' }); };
    const close = () => { if (vv) { vv.removeEventListener('resize', place); vv.removeEventListener('scroll', place); } m.hidden = true; document.removeEventListener('keydown', onKey, true); if (view === 'words') render(); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
    $('#wsWord').textContent = w.w; $('#wsMean').textContent = w.m;
    const show = () => {
      const blocks = w.ex ? exBlocks(w.ex) : [];
      $('#wsBody').innerHTML = `${blocks.length ? `<div class="exlist">${blocks.map((b, k) => `<div class="exitem"><div class="exen"><span>${esc(b[0])}</span>${TTS.ok ? `<button class="spk" data-exsay="${k}" aria-label="예문 듣기">${SPK}</button>` : ''}</div>${b.slice(1).map(l => `<div class="exko">${esc(l)}</div>`).join('')}</div>`).join('')}</div>`
        : '<div class="hint">아직 예문이 없어요. [예문 편집]으로 직접 넣거나, 단어 추가 → 예문 한 번에 넣기로 붙여넣으세요.</div>'}
        <div class="resbtns"><button class="btn sm" id="wsEdit" type="button">예문 편집</button></div>`;
      $('#wsBody').querySelectorAll('[data-exsay]').forEach(b => b.onclick = () => sayNow(blocks[+b.dataset.exsay][0]));
      $('#wsEdit').onclick = edit;
    };
    const edit = () => {
      $('#wsBody').innerHTML = `<textarea class="grow" id="wsEx" rows="4" placeholder="She was reluctant to leave.
그녀는 떠나기를 꺼렸다.

(빈 줄로 예문을 구분해요)">${esc(w.ex || '')}</textarea>
        <div class="hint">첫 줄은 영어 예문, 다음 줄은 해석. 예문끼리는 빈 줄로 구분해요.</div>
        <div class="resbtns"><button class="btn sm" id="wsCancel" type="button">취소</button><button class="btn sm primary" id="wsSave" type="button">저장</button></div>`;
      autoGrow($('#wsBody'));
      const ta = $('#wsEx'); try { ta.focus({ preventScroll: true }); } catch (e) {}
      $('#wsCancel').onclick = show;
      $('#wsSave').onclick = () => { const v = cleanEx(ta.value); if (v) w.ex = v; else delete w.ex; saveDay(f.day); toast('예문을 저장했어요'); show(); };
    };
    show();
    place(); if (vv) { vv.addEventListener('resize', place); vv.addEventListener('scroll', place); }
    m.hidden = false;
    document.addEventListener('keydown', onKey, true);
    $('#wsClose').onclick = close;
    m.onclick = e => { if (e.target === m) close(); };
  }
  function confirmModal({ title, html, ok = '삭제' }) {
    return new Promise(resolve => {
      const m = $('#modal'), prevFocus = document.activeElement;
      $('#mTitle').textContent = title; $('#mBody').innerHTML = html; $('#mOk').textContent = ok;
      // 보이는 화면(visualViewport) 위에 정확히 띄운다. 확대된 상태에서도 화면 가운데에 오도록
      const vv = window.visualViewport;
      const place = () => { if (!vv) return; Object.assign(m.style, { top: vv.offsetTop + 'px', left: vv.offsetLeft + 'px', width: vv.width + 'px', height: vv.height + 'px', right: 'auto', bottom: 'auto' }); };
      place(); if (vv) { vv.addEventListener('resize', place); vv.addEventListener('scroll', place); }
      m.hidden = false;
      try { $('#mCancel').focus({ preventScroll: true }); } catch (e) {}
      const close = v => { if (vv) { vv.removeEventListener('resize', place); vv.removeEventListener('scroll', place); } m.hidden = true; document.removeEventListener('keydown', onKey, true); m.onclick = null; try { prevFocus && prevFocus.focus({ preventScroll: true }); } catch (e) {} resolve(v); };
      const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(false); } else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); close(document.activeElement === $('#mOk')); } };
      document.addEventListener('keydown', onKey, true);
      $('#mOk').onclick = () => close(true); $('#mCancel').onclick = () => close(false);
      m.onclick = e => { if (e.target === m) close(false); };
    });
  }
  const DOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const isNarrow = () => !!(window.matchMedia && window.matchMedia('(max-width:540px)').matches);
  // 목록(Day) 펼침 상태: 폰은 기본 접힘, PC는 기본 펼침. 기기별로 기억
  let dayListOpen = (() => { try { const v = localStorage.getItem('vocab-daylist-open'); if (v !== null) return v === '1'; } catch (e) {} return !isNarrow(); })();
  const saveDayListOpen = () => { try { localStorage.setItem('vocab-daylist-open', dayListOpen ? '1' : '0'); } catch (e) {} };
  // 테스트·텍스트 뽑기의 범위 목록 펼침 상태(기기별 기억). 고른 목록이 없으면 항상 펼쳐 보여준다
  let rangeOpen = (() => { try { const v = localStorage.getItem('vocab-range-open'); if (v !== null) return v === '1'; } catch (e) {} return !isNarrow(); })();
  const saveRangeOpen = () => { try { localStorage.setItem('vocab-range-open', rangeOpen ? '1' : '0'); } catch (e) {} };
  const rangeHdr = (id, names, open) => `<button class="dayhdr" id="${id}" type="button" aria-expanded="${open}"><span class="label">범위</span><span class="dpcur">${names.length ? esc(names.join(', ')) : '선택 안 함'}</span><span class="dpar">${open ? '접기' : (names.length > 1 ? `${names.length}개 · ` : '') + '목록 열기'}</span></button>`;
  let ordering = false;
  let dayOrdering = false;          // 목록(Day) 순서 바꾸기             // 순서 바꾸기 모드
  let editSnap = null;              // 리스트 편집 시작 시점의 단어 배열(취소용)
  function exitSelect() { selecting = false; picked.clear(); ordering = false; editSnap = null; }
  const GRIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
  const setup = { sel: new Set(), dir: 'en', type: 'mc', count: 'all', nopt: '4', from: 'all', pick: 'rand', chunk: '0' };
  // 테스트 설정(범위 제외)은 다음에도 유지
  try { const o = JSON.parse(localStorage.getItem('vocab-setup') || '{}'); ['dir', 'type', 'count', 'nopt', 'from', 'pick', 'chunk'].forEach(k => { if (typeof o[k] === 'string') setup[k] = o[k]; }); } catch (e) {}
  const saveSetup = () => { try { const { sel, ...rest } = setup; localStorage.setItem('vocab-setup', JSON.stringify(rest)); } catch (e) {} };
  let quiz = null;

  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const coerce = raw => raw === 'true' ? true : raw === 'false' ? false : (raw !== '' && !isNaN(+raw)) ? +raw : raw;
  // 한 줄짜리 설정: 라벨 + 모든 선택지가 보이는 세그먼트
  const segRow = (g, k, label, val, opts) => `<div class="orow"><span class="olabel">${label}</span><div class="segc" role="radiogroup" aria-label="${label}">${opts.map(([v, l, dis]) => `<button type="button" role="radio" data-g="${g}" data-k="${k}" data-v="${esc(v)}" aria-checked="${String(v) === String(val)}" ${dis ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
  // 클릭을 한곳에서 받아 같은 그룹의 선택 표시만 바꾸고 handler에 넘긴다(화면 전체를 다시 그리지 않음)
  function bindSegs(root, handler) {
    root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      if (b.disabled) return;
      b.parentElement.querySelectorAll('[data-g]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      handler(b.dataset.k, coerce(b.dataset.v), b);
    });
  }
  const nOpts = (arr, unit, zero) => arr.map(n => [n, n === 0 ? zero : n + unit]);
  const sorted = () => days.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200);
  }

  // ---------- storage (localStorage only) ----------
  // 저장 형식: localStorage['vocab-days-v1'] = JSON 문자열 { days:[...] } 
  const APP_VER = '2026.11.25-examples';
  const LKEY = 'vocab-days-v1', BKEY = 'vocab-last-backup';
  let storageOk = true;

      if (k === 'chunk') paintVoices();   // 구간 반복 줄을 보이거나 숨김
      $('#ttsSum').textContent = ttsSummary();
      const day = days.find(d => d.id === curDay);
      if (player && day && player.dayId === day.id && k !== 'rate') { const cid = player.steps[player.cur]?.id; const was = player.playing; playDay(day, ttsOpt.order === 'seq' ? cid : null, player.only); if (!was) pausePlayer(); }
    });
  }
  // 읽기 전 다듬기: ~ 는 지우고, / 는 쉼표로. 쉼표·세미콜론 단위로 나눠 한 조각씩 읽는다
  function speechChunks(text) {
    // 한글 뜻의 ~ 는 '뭐뭐'로 바꿔 읽는다(뒤 조사와 붙여서: ~에서 → 뭐뭐에서). 영어 쪽 ~ 는 건너뛴다
    const ko = /[\uAC00-\uD7A3]/.test(String(text));
    const t = String(text).replace(/[~～∼]\s*/g, ko && ttsOpt.tilde === 'say' ? '뭐뭐' : ' ').replace(/\s*\/\s*/g, ', ').replace(/\s{2,}/g, ' ').trim();
    const parts = t.split(/\s*[,;，、\n]\s*/).map(x => x.trim()).filter(Boolean);
    return parts.length ? parts : [t];
  }
  let sTok = 0, keep = [];
  function cancelSpeech() { sTok++; keep = []; if (TTS.ok) speechSynthesis.cancel(); }
  function say(text, done) {
    if (!TTS.ok) { done && done(); return; }
    const t = sTok, chunks = speechChunks(text);
    const lang = langOf(text), voice = pickVoice(lang);
    let i = 0;
    const next = () => {
      if (t !== sTok) return;                       // 중간에 취소됨
      if (i >= chunks.length) { done && done(); return; }
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      u.lang = lang; if (voice) u.voice = voice; u.rate = ttsOpt.rate;
      keep.push(u);                                 // 재생 중 객체가 정리되지 않게 참조 유지
      let fired = false;
      // end 이벤트가 오지 않는 경우를 대비한 안전장치(글자 수로 넉넉히 계산)
      const guard = setTimeout(() => fin(), 2500 + u.text.length * 450 / ttsOpt.rate);
      const fin = () => { if (fired) return; fired = true; clearTimeout(guard); keep = keep.filter(x => x !== u); setTimeout(next, i < chunks.length ? 180 : 0); };
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    };
    next();
  }
  // 취소 직후 바로 speak 하면 Safari에서 이벤트가 안 오는 문제가 있어 잠깐 띄운다
  function sayNow(text, done) {
    if (!TTS.ok) return; stopPlayer(); cancelSpeech();
    const t = sTok; setTimeout(() => { if (t === sTok) say(text, done); }, 150);
  }

  // Day 전체 읽기 플레이어: 단계 목록을 만들고 한 문장씩 이어서 읽는다
  let player = null, ptok = 0;
  function buildSteps(day, startId, only) {
    let ws = day.words.filter(w => markOk(w, only));
    const N = +ttsOpt.chunk || 0;
    if (ttsOpt.order === 'rand') ws = shuffle(ws);
    // 구간 모드가 아닐 때만 '지금 단어부터' 자른다(구간 모드는 구간 경계가 바뀌지 않게 playDay에서 위치만 옮김)
    else if (startId && !N) { const k = ws.findIndex(w => w.id === startId); if (k > 0) ws = ws.slice(k); }
    const steps = [];
    const pushWord = (w, meta) => {
      // 단어→뜻 한 세트를 srep번 반복. 세트 안은 짧게, 반복 사이는 조금 길게, 다음 단어 전엔 더 길게 쉰다
      for (let r = 0; r < ttsOpt.srep; r++) {
        steps.push({ id: w.id, text: w.w, gap: 450, ...meta });
        if (ttsOpt.meaning) steps.push({ id: w.id, text: w.m, gap: 450, ...meta });
        steps[steps.length - 1].gap = r < ttsOpt.srep - 1 ? 750 : 1100;
      }
    };
    if (!N) { ws.forEach(w => pushWord(w, {})); return steps; }
    // 구간 반복: N개씩 끊어서 각 구간을 R번 반복한 뒤 다음 구간으로. '넘길 때까지'(crep=0)는 1번만 만들고 stepPlayer에서 되감는다
    const R = ttsOpt.crep ? +ttsOpt.crep : 1;
    for (let ci = 0; ci * N < ws.length; ci++) {
      const part = ws.slice(ci * N, (ci + 1) * N);
      for (let rr = 0; rr < R; rr++) {
        part.forEach(w => pushWord(w, { chunk: ci, crep: rr }));
        const last = steps[steps.length - 1]; last.gap = 1800; last.endOfRep = true;
      }
    }
    return steps;
  }
  // 재생 중에만 화면이 꺼지지 않게(Screen Wake Lock). 지원하지 않는 브라우저에선 조용히 넘어간다
  let wakeLock = null, wakeReq = false;
  async function keepAwake(on) {
    if (!('wakeLock' in navigator)) return;
    try {
      if (on) {
        if (wakeLock || wakeReq) return;
        wakeReq = true;
        const lock = await navigator.wakeLock.request('screen');
        wakeReq = false;
        if (!player || !player.playing) { lock.release().catch(() => {}); return; }   // 그새 멈췄으면 바로 반납
        wakeLock = lock;
        lock.addEventListener('release', () => { if (wakeLock === lock) { wakeLock = null; paintPlayer(); } });
        paintPlayer();
      } else if (wakeLock) { const lock = wakeLock; wakeLock = null; await lock.release(); }
    } catch (e) { wakeReq = false; }
  }
  // 다른 앱에 갔다 오면 잠금이 자동 해제되므로, 재생 중이면 다시 요청
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && player && player.playing) keepAwake(true); });
  function playDay(day, startId, only = false) {
    if (!TTS.ok || !day.words.length) return;
    const steps = buildSteps(day, startId, only);
    if (!steps.length) { toast(only === 'focus' ? '이 목록에 집중 표시한 단어가 없어요' : '이 목록에 체크한 단어가 없어요'); return; }
    stopPlayer(); cancelSpeech();
    let cur = 0;
    if (startId && steps[0].chunk !== undefined) { const i = steps.findIndex(x => x.id === startId); if (i > 0) cur = steps.findIndex(x => x.chunk === steps[i].chunk); }
    const p = player = { dayId: day.id, only, steps, cur, playing: true, timer: null };
    keepAwake(true);
    paintPlayer();
    p.timer = setTimeout(() => { if (player === p && p.playing) stepPlayer(); }, 150);
  }
  function stepPlayer() {
    if (!player || !player.playing) return;
    if (player.cur >= player.steps.length) {
      const day = days.find(d => d.id === player.dayId);
      // 계속 반복: 목록을 새로 만들어(랜덤이면 다시 섞고, 그사이 추가·체크 변경도 반영) 처음부터
      const again = ttsOpt.loop && day ? buildSteps(day, null, player.only) : [];
      if (!again.length) { stopPlayer(); toast('다 읽었어요'); return; }
      player.steps = again; player.cur = 0; player.round = (player.round || 1) + 1; player.followId = null;
    }
    const st = player.steps[player.cur], t = ++ptok;
    if (st.chunk !== player.lastChunk) { player.lastChunk = st.chunk; player.chunkRound = 1; }
    markSpeaking(st.id); paintPlayer();
    say(st.text, () => {
      if (t !== ptok || !player || !player.playing) return;
      player.timer = setTimeout(() => {
        if (t !== ptok || !player) return;
        if (st.endOfRep && ttsOpt.chunk && !ttsOpt.crep) {   // 넘길 때까지: 같은 구간 처음으로
          player.cur = player.steps.findIndex(x => x.chunk === st.chunk); player.chunkRound++; player.followId = null;
        } else player.cur++;
        stepPlayer();
      }, st.gap);
    });
  }
  function jumpChunk(d) {
    if (!player) return;
    const curSt = player.steps[Math.min(player.cur, player.steps.length - 1)];
    if (!curSt || curSt.chunk === undefined) return;
    const i = player.steps.findIndex(x => x.chunk === curSt.chunk + d);
    if (i < 0) return;
    ptok++; clearTimeout(player.timer); cancelSpeech();
    player.cur = i; player.followId = null; player.lastChunk = undefined;
    const p = player;
    if (p.playing) p.timer = setTimeout(() => { if (player === p && p.playing) stepPlayer(); }, 150);
    else { markSpeaking(p.steps[i].id); paintPlayer(); }
  }
  function pausePlayer() { if (!player) return; player.playing = false; ptok++; clearTimeout(player.timer); cancelSpeech(); keepAwake(false); paintPlayer(); }
  function resumePlayer() { if (!player) return; const p = player; p.playing = true; keepAwake(true); paintPlayer(); p.timer = setTimeout(() => { if (player === p && p.playing) stepPlayer(); }, 150); }
  function stopPlayer() {
    if (player) clearTimeout(player.timer);
    const had = !!player; player = null; ptok++;
    if (had) cancelSpeech();
    keepAwake(false);
    markSpeaking(null); paintPlayer();
  }
  function markSpeaking(id) {
    document.querySelectorAll('.row.speaking').forEach(r => r.classList.remove('speaking'));
    if (!id) return;
    const r = document.querySelector(`.list .row[data-w="${id}"]`);
    if (!r) return;
    r.classList.add('speaking');
    // 화면 따라가기: 읽는 단어가 바뀔 때만 한 번 이동(같은 단어 반복 중엔 손으로 스크롤해도 끌려가지 않게)
    if (ttsOpt.follow && player && player.followId !== id) {
      player.followId = id;
      // 브라우저의 scrollIntoView 대신 위치를 직접 계산해 창(window)만 스크롤한다(iOS에서 엉뚱한 위치로 가는 문제 방지)
      // 보이는 화면 높이는 주소창·툴바를 뺀 visualViewport 기준. 이미 화면 가운데 영역(위아래 25%)에 있으면 움직이지 않음
      const vv = window.visualViewport;
      const vh = vv ? vv.height : window.innerHeight;
      // 문서 기준 위치: offsetTop을 부모까지 더한다
      let docTop = 0; for (let n = r; n; n = n.offsetParent) docTop += n.offsetTop;
      const cur = window.pageYOffset || document.documentElement.scrollTop || 0;
      const visTop = vv ? vv.pageTop : cur;             // 실제로 보이는 영역의 문서 기준 위쪽
      const relTop = docTop - visTop;
      let target = null;
      if (relTop < vh * 0.25 || relTop + r.offsetHeight > vh * 0.75) {
        const maxTop = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        target = Math.min(maxTop, Math.max(0, docTop - (vh - r.offsetHeight) / 2 - (vv ? vv.offsetTop : 0)));
        window.scrollTo(0, target);   // 부드러운 스크롤 없이 바로 이동
      }
      // 확인용 표시(화면 맨 아래 버전 옆): 계산값과 0.4초 뒤 실제 위치
      const dbg = $('#followDbg');
      if (dbg) setTimeout(() => {
        const now = window.pageYOffset || document.documentElement.scrollTop || 0;
        dbg.textContent = `따라가기 확인: 줄 ${Math.round(docTop)} · 보던 위치 ${Math.round(cur)} · 목표 ${target === null ? '이동 안 함' : Math.round(target)} · 실제 ${Math.round(now)} · 문서 ${document.documentElement.scrollHeight} · 창 ${window.innerHeight}/${Math.round(vh)} · 배율 ${vv ? vv.scale.toFixed(2) : '-'}`;
      }, 400);
    }
  }
  function paintPlayer() {
    const box = $('#playerBox'); if (!box) return;
    const day = days.find(d => d.id === curDay); if (!day) return;
    const mine = player && player.dayId === day.id;
    const st = mine ? player.steps[Math.min(player.cur, player.steps.length - 1)] : null;
    const w = st ? day.words.find(x => x.id === st.id) : null;
    const nChk = day.words.filter(x => x.checked).length, nFoc = day.words.filter(x => x.focus).length;
    const pos = mine ? `${new Set(player.steps.slice(0, player.cur + 1).map(s => s.id)).size} / ${new Set(player.steps.map(s => s.id)).size}` : '';
    box.innerHTML = `<div class="top">
        ${!mine ? `<button class="btn primary sm" id="pPlay" ${day.words.length ? '' : 'disabled'}>전체 듣기</button><button class="btn sm" id="pPlayChk" ${nChk ? '' : 'disabled'}>체크만 <span class="num">${nChk}</span></button><button class="btn sm" id="pPlayFoc" ${nFoc ? '' : 'disabled'}>★ 집중만 <span class="num">${nFoc}</span></button>`
          : player.playing ? `<button class="btn primary sm" id="pPause">일시정지</button>` : `<button class="btn primary sm" id="pResume">이어 듣기</button>`}
        ${mine ? `<button class="btn sm" id="pStop">정지</button>` : ''}
        <span class="now">${w ? `<span class="num">${player.only === 'focus' ? '집중 ' : player.only ? '체크 ' : ''}${pos}${player.round > 1 ? ` · ${player.round}바퀴` : ''}</span> · <b>${esc(w.w)}</b> ${esc(w.m)}` : nChk || nFoc ? '' : '체크(✓)나 집중(★)을 표시하면 그 단어만 들을 수 있어요'}</span>

    $('#cAgain') && ($('#cAgain').onclick = () => jumpChunk(0));
    $('#cNext') && ($('#cNext').onclick = () => jumpChunk(1));
  }

  // ---------- render: word book ----------

      : list.map(d => `<button class="chip" aria-pressed="${d.id === curDay}" data-day="${d.id}">${esc(d.name)} <span class="num">${d.words.length}</span></button>`).join('');

      : ordering
